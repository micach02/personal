<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Michael Vincent Abellar | Web Application Developer</title>
    <!--
      GitHub Pages has no server-side router, so it serves this file (with a 404 status)
      for any deep link that isn't a real static file — e.g. a direct visit or refresh on
      /personal/project/3. This script re-encodes that path into the query string and
      redirects to the real app root, where the matching script in index.html decodes it
      back before React Router ever sees the URL.
      Pattern: https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1; // keep the "/personal" repo-name segment

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
